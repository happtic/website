<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>happtic</title>
  <meta name="description" content="happtic — an independent software studio." />

  <!-- Bauhaus mark favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='11' cy='16' r='7' fill='%23fff'/%3E%3Crect x='18' y='9' width='7' height='14' fill='%23fff'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050505;
      --fg: #f4f4f2;
      --dim: #6b6b68;
      --line: rgba(244, 244, 242, 0.09);
      --line-strong: rgba(244, 244, 242, 0.18);
      --grid: 26px;
      --edge: clamp(20px, 5vw, 72px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 400;
      line-height: 1.4;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- graph-paper grid (retro CRT / constructivist substrate) ---- */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      -webkit-mask-image: radial-gradient(ellipse 120% 120% at 50% 42%, #000 55%, transparent 100%);
              mask-image: radial-gradient(ellipse 120% 120% at 50% 42%, #000 55%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---- CRT scanline sweep ---- */
    .scan {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0) 4px
      );
      mix-blend-mode: multiply;
    }
    .scan::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      height: 26%;
      top: -30%;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.035), transparent);
      animation: sweep 7.5s linear infinite;
    }
    @keyframes sweep { to { top: 130%; } }

    /* ---- registration / crop marks in each corner (technical print feel) ---- */
    .frame { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    .mark {
      position: absolute;
      width: 16px; height: 16px;
      border-color: var(--line-strong);
      border-style: solid;
    }
    .mark.tl { top: var(--edge); left: var(--edge); border-width: 1px 0 0 1px; }
    .mark.tr { top: var(--edge); right: var(--edge); border-width: 1px 1px 0 0; }
    .mark.bl { bottom: var(--edge); left: var(--edge); border-width: 0 0 1px 1px; }
    .mark.br { bottom: var(--edge); right: var(--edge); border-width: 0 1px 1px 0; }

    /* ---- top + bottom status rails (terminal readout) ---- */
    .rail {
      position: fixed;
      left: var(--edge); right: var(--edge);
      z-index: 4;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: clamp(9px, 1.05vw, 11px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .rail.top { top: calc(var(--edge) - 4px); }
    .rail.bottom { bottom: calc(var(--edge) - 4px); }
    .rail span { white-space: nowrap; }
    .rail .live::before {
      content: "";
      display: inline-block;
      width: 6px; height: 6px;
      margin-right: 7px;
      background: #b6ff3a;
      border-radius: 50%;
      box-shadow: 0 0 8px #b6ff3a;
      animation: pulse 2s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ---- center stage ---- */
    .stage {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(var(--edge) + 30px) var(--edge);
    }

    /* Bauhaus primary-shape trio, on the grid, above the wordmark */
    .shapes {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(26px, 5vh, 48px);
    }
    .shapes i { display: block; }
    .shapes .circle { width: 20px; height: 20px; border: 2px solid var(--fg); border-radius: 50%; }
    .shapes .square { width: 18px; height: 18px; background: var(--fg); }
    .shapes .tri {
      width: 0; height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 19px solid var(--fg);
    }

    .wordmark {
      position: relative;
      font-weight: 700;
      font-size: clamp(3rem, 15vw, 11rem);
      letter-spacing: clamp(0.05em, 1.2vw, 0.14em);
      line-height: 0.9;
      text-transform: lowercase;
      color: var(--fg);
    }
    /* holographic shimmer swept across the wordmark — the one pop of colour */
    .wordmark .sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 20%,
        #ff2e88 34%,
        #a468ff 42%,
        #38f0ff 50%,
        #b6ff3a 58%,
        transparent 74%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
              color: transparent;
      mix-blend-mode: screen;
      animation: shimmer 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0%   { background-position: 160% 0; opacity: 0; }
      35%  { opacity: 1; }
      65%  { opacity: 1; }
      100% { background-position: -60% 0; opacity: 0; }
    }
    .cursor {
      display: inline-block;
      width: 0.09em;
      height: 0.82em;
      margin-left: 0.06em;
      background: var(--fg);
      vertical-align: baseline;
      transform: translateY(0.06em);
      animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .tagline {
      margin-top: clamp(24px, 5vh, 44px);
      font-size: clamp(11px, 1.5vw, 14px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .contact {
      margin-top: clamp(30px, 6vh, 56px);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 13px 22px;
      font-size: clamp(12px, 1.5vw, 14px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--line-strong);
      background: rgba(244, 244, 242, 0.015);
      position: relative;
      overflow: hidden;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .contact .arrow { color: var(--dim); transition: transform 0.25s ease, color 0.25s ease; }
    .contact::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent, #38f0ff, #a468ff, #ff2e88, transparent);
      background-size: 250% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
      mix-blend-mode: overlay;
    }
    .contact:hover { border-color: transparent; }
    .contact:hover::before { opacity: 0.9; animation: shimmer 1.6s linear infinite; }
    .contact:hover .arrow { transform: translateX(4px); color: var(--fg); }
    .contact:focus-visible { outline: 2px solid #38f0ff; outline-offset: 3px; }

    @media (max-width: 560px) {
      .rail span.hide-sm { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan::after, .wordmark .sheen, .cursor, .rail .live::before, .contact:hover::before { animation: none; }
      .wordmark .sheen { opacity: 0.85; background-position: 50% 0; }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>

  <div class="frame" aria-hidden="true">
    <span class="mark tl"></span><span class="mark tr"></span>
    <span class="mark bl"></span><span class="mark br"></span>
  </div>

  <div class="rail top" aria-hidden="true">
    <span>happtic // software studio</span>
    <span class="hide-sm">system: online</span>
  </div>

  <main class="stage">
    <div class="shapes" aria-hidden="true">
      <i class="circle"></i><i class="square"></i><i class="tri"></i>
    </div>

    <h1 class="wordmark">
      happtic<span class="cursor" aria-hidden="true"></span>
      <span class="sheen" aria-hidden="true">happtic&nbsp;</span>
    </h1>

    <p class="tagline">an independent software studio</p>

    <a class="contact" href="mailto:contact@happtic.com">
      contact@happtic.com <span class="arrow" aria-hidden="true">&rsaquo;</span>
    </a>
  </main>

  <div class="rail bottom" aria-hidden="true">
    <span class="hide-sm">est. mmxvi</span>
    <span class="live">transmitting</span>
  </div>

  <div class="scan" aria-hidden="true"></div>
</body>
</html>
